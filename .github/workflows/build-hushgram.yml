name: Build and patch Instagram APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag containing the APK asset (example: manual-apk)"
        required: true
        type: string
      apk_asset_name:
        description: "Exact uploaded APK asset filename (example: instagram.apk; do not use XAPK)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check package registry credentials
        env:
          GITHUB_TOKEN: ${{ secrets.PATCHER_READ_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Add repository Actions secret PATCHER_READ_TOKEN with read:packages permission."
            exit 1
          fi

      - name: Build HushGram .mpp bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PATCHER_READ_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:generatePatchesList :patches:buildAndroid

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: HushGram-patch-bundle
          path: |
            patches/build/**/*.mpp
          if-no-files-found: error
          retention-days: 1

  patch-apk:
    needs: build-patches
    runs-on: ubuntu-latest
    steps:
      - name: Download HushGram patch bundle
        uses: actions/download-artifact@v4
        with:
          name: HushGram-patch-bundle
          path: patches

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Morphe Desktop CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MorpheApp/morphe-desktop --pattern '*all.jar' --dir .
          JAR="$(find . -maxdepth 1 -type f -name '*all.jar' -print -quit)"
          if [ -z "$JAR" ]; then
            echo "::error::Could not find Morphe Desktop CLI all-in-one JAR in the latest release."
            exit 1
          fi
          echo "MORPHE_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Download uploaded APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_ASSET_NAME: ${{ inputs.apk_asset_name }}
        run: |
          # GitHub Actions workflow_dispatch has no native binary file-upload input.
          # Upload the APK as an asset on an existing GitHub Release, then select it here.
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_ASSET_NAME" \
            --dir .
          if [ ! -f "$APK_ASSET_NAME" ] || [ ! -s "$APK_ASSET_NAME" ]; then
            echo "::error::Release asset '$APK_ASSET_NAME' was not downloaded. Check the release tag and exact asset filename."
            exit 1
          fi
          mv "$APK_ASSET_NAME" original-instagram.apk
          file original-instagram.apk
          if ! unzip -t original-instagram.apk >/dev/null 2>&1; then
            echo "::error::Uploaded file is not a valid ZIP/APK. Do not upload an XAPK container."
            exit 1
          fi
          if ! unzip -Z1 original-instagram.apk | grep -qx 'AndroidManifest.xml'; then
            echo "::error::No root AndroidManifest.xml found. This looks like an XAPK/split container, not a standalone base APK."
            exit 1
          fi
          echo "Standalone APK archive validated."

      - name: Patch APK with HushGram
        run: |
          BUNDLE="$(find patches -type f -name '*.mpp' -print -quit)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::No .mpp bundle found in downloaded build artifact."
            exit 1
          fi
          java -jar "$MORPHE_JAR" patch -p "$BUNDLE" original-instagram.apk
          PATCHED_APK="original-instagram-patched.apk"
          test -s "$PATCHED_APK"
          mv "$PATCHED_APK" hushgram-patched.apk
          unzip -t hushgram-patched.apk >/dev/null
          sha256sum hushgram-patched.apk | tee hushgram-patched.apk.sha256

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: HushGram-patched-Instagram-APK
          path: |
            hushgram-patched.apk
            hushgram-patched.apk.sha256
          if-no-files-found: error
          retention-days: 3
