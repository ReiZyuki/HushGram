name: Build HushGram patch bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check package registry credentials
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PATCHER_READ_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Add a repository Actions secret named PATCHER_READ_TOKEN with read:packages permission."
            exit 1
          fi

      - name: Build HushGram .mpp bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PATCHER_READ_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:generatePatchesList
          ./gradlew :patches:buildAndroid

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: HushGram-patch-bundle
          path: |
            patches/build/release/*.mpp
            patches/build/release/*.sha256
            patches/build/release/*.cdx.json
          if-no-files-found: error
          retention-days: 7
